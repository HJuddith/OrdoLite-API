jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e
          echo "🚀 Trigger deploy…"
          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys \
            -d '{}')
          echo "$resp"
          id=$(echo "$resp" | jq -r '.id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "❌ Impossible de récupérer l'ID de déploiement."
            exit 1
          fi

          echo "⏳ Attente du résultat (max ~15 min)…"
          for i in $(seq 1 180); do
            sleep 5
            s=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$id | jq -r '.status')
            echo "  • status=$s"
            case "$s" in
              live) echo "✅ Déploiement OK"; exit 0 ;;
              failed|canceled) echo "❌ Déploiement $s"; exit 1 ;;
            esac
          done
          echo "⚠️ Timeout d'attente."
          exit 1

      - name: Done
        run: echo "CD terminé."
