name: CI/CD OrdoLite-API

on:
  push:
    branches:
      - main  # Déploiement automatique uniquement sur main

jobs:
  ci:
    name: Run Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test

  cd:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: ci  # Déploiement uniquement si la CI réussit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            cd ~/OrdoLite-API
            git pull origin main
            # Option 1 : déploiement via Docker
            docker compose down
            docker compose up -d --build
            docker image prune -f
            # Option 2 : déploiement sans Docker, avec sync:dev
            # npm install
            # npm run sync:dev
            # pm2 restart ordolite || pm2 start npm --name "ordolite" -- start
