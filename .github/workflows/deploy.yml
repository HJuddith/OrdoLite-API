name: CI/CD & Backups OrdoLite-API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Backup chaque nuit à 03:00 Europe/Paris (~01:00 UTC en été)
    - cron: "0 1 * * *"

jobs:

  # CI : Tests automatiques

  ci:
    name: Run Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: jud
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: ordolite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jud -d ordolite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      CI: true
      DATABASE_URL: postgres://jud:admin@localhost:5432/ordolite

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U jud -d ordolite && break
            echo "Waiting for Postgres…"; sleep 2
          done

      - name: Sync DB
        run: npm run sync:test

      - name: Run tests
        run: npm test

  # CD : Déploiement sur Render

  cd_deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}   

  # Backup : PostgreSQL (Neon)

  nightly_backup:
    if: github.event_name == 'schedule'
    name: Nightly Backup
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Paris
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Create backup directory
        run: mkdir -p backups

      - name: Dump Neon PostgreSQL
        run: |
          TS="$(date +%Y%m%d-%H%M%S)"
          pg_dump --dbname="$DATABASE_URL" -Fc -f "backups/db-$TS.dump"

      - name: Upload backup artifacts (14 jours)
        uses: actions/upload-artifact@v4
        with:
          name: ordolite-backup-${{ github.run_id }}
          path: backups/*
          retention-days: 14
