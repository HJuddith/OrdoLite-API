name: Test SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping VM
        run: |
          ping -c 3 ${{ secrets.VM_HOST }}
          nc -zv ${{ secrets.VM_HOST }} 22

      - name: SSH Test
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            echo "Connexion SSH réussie !"
            whoami
            pwd
