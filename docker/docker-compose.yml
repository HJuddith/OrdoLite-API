version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: ordolite_db
    restart: always
    environment:
      POSTGRES_USER: jud
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ordolite
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: ordolite_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ordolite_api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../.env.docker
    depends_on:
      - db

volumes:
  db_data:
